<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Danoya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#fff6ee;--soft:#e9d6f2;--gold:#ffd34d;--pink:#ff7eb6;--coral:#ff6f5e;--teal:#2ec4a6;--card:#2a1440;--line:#ffffff26;--dark:#1a0c24;
  --display:"Bungee",Impact,system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1a0c24;color:var(--ink);font-family:var(--body);font-weight:700;transition:background 1.6s ease;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.sunny{background:#3a1a3e}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font:400 clamp(1.15rem,5vw,1.5rem) var(--display);margin:0;background:linear-gradient(180deg,#ffd57a,#ff6f8f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.snd{font:900 .85rem var(--body);background:#ffffff14;color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 10px 30px #0008;background:#000;touch-action:manipulation}
.stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff30;transition:background .3s,transform .3s}.dots i.on{background:var(--gold);transform:scale(1.3)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.who{font:900 .78rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.say{font-size:1.08rem;line-height:1.5;margin:0;text-wrap:pretty}
.say.hand{font-family:var(--hand);font-size:1.55rem;line-height:1.25;color:#ffe9b8}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:900 1rem var(--body);border:0;border-radius:99px;padding:12px 20px;cursor:pointer;color:#2a1020;background:var(--gold);box-shadow:0 5px 0 #9a6a10;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a6a10}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #a0336a}.btn.pink:active{box-shadow:0 2px 0 #a0336a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.bub{position:absolute;transform:translate(-50%,-50%);font:900 clamp(.7rem,3.2vw,.9rem) var(--body);color:#3a1a3e;background:radial-gradient(circle at 30% 30%,#fff,#d9c8ff 60%,#b79cff);border:0;border-radius:99px;padding:9px 13px;box-shadow:0 4px 14px #0006,inset 0 -3px 0 #0001;cursor:pointer;animation:float 3s ease-in-out infinite;white-space:nowrap}
.bub:nth-child(2n){animation-delay:-1.2s}.bub:nth-child(3n){animation-delay:-2s}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
.bub.pop{animation:pop .35s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.breath{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(1rem,5vw,1.4rem) var(--display);color:#fff;text-shadow:0 2px 8px #000a;pointer-events:none;text-align:center}
.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font:400 .9rem var(--display);color:#fff;text-shadow:0 2px 0 #0008;pointer-events:none}
.note{background:#fff6dd;color:#4a2a1a;border-radius:6px;padding:16px 16px 14px;font-family:var(--hand);font-size:1.5rem;line-height:1.25;box-shadow:0 6px 18px #0007;transform:rotate(-1.5deg);animation:noteIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes noteIn{from{transform:rotate(-8deg) translateY(30px) scale(.8);opacity:0}}
.letter{background:#fff6e8;color:#3a2016;border-radius:10px;padding:20px 18px;font-family:var(--hand);font-size:1.45rem;line-height:1.3;box-shadow:0 8px 24px #0008}
.letter p{margin:0 0 10px}.letter .sig{text-align:right;font-size:1.7rem;color:#b3402f;margin:6px 0 0}
.plan{display:flex;flex-direction:column;gap:8px}
.plan label{display:flex;align-items:center;gap:10px;background:#ffffff0f;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:800}
.plan input{width:22px;height:22px;accent-color:var(--teal)}
.plan label.done{border-color:var(--teal);background:#2ec4a61f}
.small{font-size:.85rem;color:var(--soft);margin:0}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
.vnote{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ff7eb633,#ffd34d22);border:2px solid #ff7eb6;border-radius:16px;padding:12px 14px;margin:0 0 14px}
.vnote button{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:#ff7eb6;color:#2a0f24;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 #b84d82}
.vnote button:active{transform:translateY(3px);box-shadow:0 1px 0 #b84d82}
.vnote .vt{flex:1;min-width:0}.vnote b{display:block;font-weight:900}.vnote .bar{height:6px;border-radius:9px;background:#ffffff22;margin-top:7px;overflow:hidden}.vnote .bar i{display:block;height:100%;width:0;background:#ffd34d}
.vnote small{opacity:.75;font-size:.8rem}
.stage.playing,.stage.playing *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.lock,html.lock body{overscroll-behavior:none}
</style>

<div class="wrap">
  <header><h1>A little rescue for Danoya</h1><button class="snd" id="snd" type="button" aria-pressed="false">♪ Music off</button></header>

  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>
